name: chestzip
base: core22
version: "1.0.0"
summary: Open-source archive manager with zip bomb protection
description: |
  ChestZip creates and extracts CHZ (its own open format), ZIP, 7Z, TAR and
  TAR.GZ/BZ2/XZ archives and extracts RAR. It protects against zip bombs,
  Zip Slip path traversal and malicious symbolic links.
license: MIT
website: https://github.com/mesutozansoftware/chestzip
source-code: https://github.com/mesutozansoftware/chestzip
icon: packaging/icons/chestzip.png
grade: stable
confinement: strict
architectures:
  - build-on: amd64

apps:
  chestzip:
    command: bin/chestzip
    extensions: [gnome]
    desktop: usr/share/applications/chestzip.desktop
    environment:
      QT_QPA_PLATFORM: xcb
    plugs: [home, removable-media, network]

parts:
  chestzip:
    plugin: python
    source: .
    build-packages: [python3-pip]
    stage-packages:
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxcb-image0
      - libxcb-xkb1
      - libxkbcommon-x11-0
      - libegl1
    override-build: |
      craftctl default
      install -Dm644 packaging/chestzip.desktop $CRAFT_PART_INSTALL/usr/share/applications/chestzip.desktop
      sed -i 's|^Icon=.*|Icon=${SNAP}/meta/gui/icon.png|' $CRAFT_PART_INSTALL/usr/share/applications/chestzip.desktop
      install -Dm644 packaging/chestzip-mime.xml $CRAFT_PART_INSTALL/usr/share/mime/packages/chestzip.xml
