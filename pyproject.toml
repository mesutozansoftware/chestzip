[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chestzip"
version = "1.1.0"
description = "Açık kaynaklı, çapraz platform arşiv yöneticisi (zip bombası korumalı)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "mesutozansoftware" }]
keywords = ["archive", "zip", "7z", "rar", "tar", "compression", "zip-bomb", "gui"]
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.5",
    "py7zr>=0.22",
    "pyzipper>=0.3.6",
    "rarfile>=4.1",
    "py7zz>=1.0",         # gömülü 7-Zip (7zz): ek araç kurmadan RAR açmak için
    "cryptography>=41",   # başlığı şifreli RAR'lar için
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Turkish",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Archiving :: Compression",
]

[project.urls]
Homepage = "https://github.com/mesutozansoftware/chestzip"
Source = "https://github.com/mesutozansoftware/chestzip"
Issues = "https://github.com/mesutozansoftware/chestzip/issues"
"Format specification" = "https://github.com/mesutozansoftware/chestzip/blob/main/docs/CHZ_FORMAT.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
chestzip = "chestzip.cli:main"

[project.gui-scripts]
chestzip-gui = "chestzip.gui.app:main"

[tool.setuptools.packages.find]
include = ["chestzip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
