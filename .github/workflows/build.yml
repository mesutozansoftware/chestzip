name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux Qt bağımlılıkları
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: pytest -q

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux Qt bağımlılıkları
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: pip install . pyinstaller
      - run: python packaging/make_icons.py
      - run: pyinstaller --noconfirm packaging/chestzip.spec
      - name: Arşivle (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/ChestZip/* -DestinationPath ChestZip-windows-x64.zip
      - name: Kurulum programı (Windows, .chz ilişkilendirmesi)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc packaging\windows\chestzip.iss
          Copy-Item dist\ChestZip-setup-windows-x64.exe .
      - name: Arşivle (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/ChestZip.app" ChestZip-macos.zip
      - name: Arşivle (Linux)
        if: runner.os == 'Linux'
        run: |
          cp packaging/linux-install.sh packaging/chestzip.desktop packaging/chestzip-mime.xml packaging/icons/chestzip.png packaging/icons/chz-document.png dist/ChestZip/
          tar -C dist -czf ChestZip-linux-x64.tar.gz ChestZip
      - uses: actions/upload-artifact@v4
        with:
          name: chestzip-${{ runner.os }}
          path: ChestZip-*
      - name: Sürüme ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ChestZip-*
