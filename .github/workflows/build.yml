name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen
  PYTHON_VERSION: "3.12"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Linux Qt bağımlılıkları
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: pytest -q

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sürüm
        shell: bash
        run: |
          V=$(python -c "import re;print(re.search(r'^version = \"(.+)\"', open('pyproject.toml').read(), re.M).group(1))")
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Linux Qt bağımlılıkları
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: pip install . pyinstaller
      - run: python packaging/make_icons.py
      - run: pyinstaller --noconfirm packaging/chestzip.spec
      - name: Paketlenmiş uygulamayı dene (RAR + CHZ)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN="dist/ChestZip.app/Contents/MacOS/chestzip";
          elif [ "$RUNNER_OS" = "Windows" ]; then BIN="dist/ChestZip/chestzip.exe";
          else BIN="dist/ChestZip/chestzip"; fi
          if [ "$RUNNER_OS" != "Windows" ]; then
            "$BIN" --version
            "$BIN" x tests/data/rar/rar5-hpsw.rar -p password -o smoke/rar -q
            "$BIN" a smoke/t.chz README.md -q && "$BIN" t smoke/t.chz -q
          fi
      - name: Arşivle (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/ChestZip/* -DestinationPath ChestZip-${{ env.VERSION }}-windows-x64.zip
      - name: Kurulum programı (Windows, .chz ilişkilendirmesi)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${env:VERSION}" packaging\windows\chestzip.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\ChestZip-setup-windows-x64.exe "ChestZip-${env:VERSION}-setup-windows-x64.exe"
      - name: Arşivle (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/ChestZip.app" "ChestZip-${VERSION}-macos-arm64.zip"
      - name: Arşivle (Linux, tar.gz + deb)
        if: runner.os == 'Linux'
        run: |
          cp packaging/linux-install.sh packaging/chestzip.desktop packaging/chestzip-mime.xml packaging/icons/chestzip.png packaging/icons/chz-document.png dist/ChestZip/
          tar -C dist -czf "ChestZip-${VERSION}-linux-x64.tar.gz" ChestZip
          sh packaging/build-deb.sh "$VERSION" amd64
          sudo apt-get install -y "./chestzip_${VERSION}_amd64.deb"
          chestzip --version
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: |
            ChestZip-*
            chestzip_*.deb

  flatpak:
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ChestZip.flatpak
          manifest-path: packaging/flatpak/io.github.mesutozansoftware.ChestZip.yml
          upload-artifact: false
      - name: Paket adı
        run: |
          V=$(python3 -c "import re;print(re.search(r'^version = \"(.+)\"', open('pyproject.toml').read(), re.M).group(1))")
          mv ChestZip.flatpak "ChestZip-${V}-linux-x64.flatpak"
      - uses: actions/upload-artifact@v4
        with:
          name: package-flatpak
          path: ChestZip-*.flatpak

  release:
    # Flatpak başarısız olsa bile ana paketlerle yayınlanır.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' }}
    needs: [package, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true
      - name: Sürüm etiketi pyproject ile aynı mı?
        run: |
          V=$(python3 -c "import re;print(re.search(r'^version = \"(.+)\"', open('pyproject.toml').read(), re.M).group(1))")
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "Etiket ${GITHUB_REF_NAME} != v$V"; exit 1; }
      - name: SHA256 listesi
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "ChestZip $GITHUB_REF_NAME" --notes-file packaging/RELEASE_NOTES.md
